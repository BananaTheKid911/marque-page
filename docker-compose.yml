services:
  marquepage:
    build:
      context: .
    image: marquepage:latest
    container_name: marquepage
    restart: unless-stopped
    environment:
      - TZ=Europe/Paris
      # Lu depuis Phase 5 (reconstruction sessions KOReader, SPEC §4.2).
      # Interpolation : .env à la racine si présent, sinon défaut 900.
      - SESSION_GAP_SEC=${SESSION_GAP_SEC:-900}
    volumes:
      - /home/banserv/docker/marquepage/data:/app/data
      - /home/banserv/docker/marquepage/covers:/app/covers
      # Dossier surveillé KOReader (§4.4, décision 16/08) : la Kindle pousse
      # son statistics.sqlite3 en WebDAV ici quand elle est sur le même WiFi.
      # Cible du serveur WebDAV à monter (Phase 6) — le watcher de l'app
      # scrute ce dossier et importe automatiquement.
      - /home/banserv/docker/marquepage/koreader-inbox:/app/koreader-inbox
    ports:
      # Bindé sur Tailscale (100.68.214.9) uniquement — jamais sur 0.0.0.0.
      - "100.68.214.9:8123:8000"
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

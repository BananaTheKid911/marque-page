[project]
name = "marquepage-backend"
version = "0.1.0"
description = "Backend API pour Marque-page"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
